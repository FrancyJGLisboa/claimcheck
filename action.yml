name: "claimcheck"
description: "Deterministic veto: block when AI-written prose asserts a number, quote, or date its source data doesn't contain."
branding:
  icon: "check-circle"
  color: "green"
inputs:
  prose:
    description: "Path to the prose/summary file to check."
    required: true
  data:
    description: "Path to the JSON evidence file the prose must be grounded in."
    required: true
  strict:
    description: "Fail on advisory warnings (unsupported figures) too. Default only fails on errors."
    required: false
    default: "false"
  window:
    description: "Optional FROM,TO ISO date window, enabling the stale-date check."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: |
        args=(--prose "${{ inputs.prose }}" --data "${{ inputs.data }}")
        [ "${{ inputs.strict }}" = "true" ] && args+=(--strict)
        [ -n "${{ inputs.window }}" ] && args+=(--window "${{ inputs.window }}")
        claimcheck "${args[@]}"
